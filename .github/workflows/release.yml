name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  BINARY_NAME: sdwan-triage

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      # ─── CHECKOUT ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── EXTRACT VERSION ───────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # ─── NODE / FRONTEND ───────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build React frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist to embed directory
        run: |
          rm -rf cmd/sdwan-triage/dist
          mkdir -p cmd/sdwan-triage/dist
          cp -r web/frontend/dist/* cmd/sdwan-triage/dist/

      # ─── GO / BACKEND ─────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./... -timeout 60s

      - name: Define ldflags
        id: ldflags
        run: |
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X main.version=${{ steps.version.outputs.version }}"
          LDFLAGS="$LDFLAGS -X main.buildCommit=${{ steps.version.outputs.commit }}"
          LDFLAGS="$LDFLAGS -X main.buildDate=${{ steps.version.outputs.date }}"
          echo "flags=$LDFLAGS" >> "$GITHUB_OUTPUT"

      # ─── CROSS-COMPILE ────────────────────────────────────
      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags '${{ steps.ldflags.outputs.flags }}' -o build/${{ env.BINARY_NAME }}-linux-amd64 ./cmd/sdwan-triage
          tar -czf build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz -C build ${{ env.BINARY_NAME }}-linux-amd64

      - name: Build macOS amd64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags '${{ steps.ldflags.outputs.flags }}' -o build/${{ env.BINARY_NAME }}-darwin-amd64 ./cmd/sdwan-triage
          tar -czf build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-darwin-amd64.tar.gz -C build ${{ env.BINARY_NAME }}-darwin-amd64

      - name: Build macOS arm64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags '${{ steps.ldflags.outputs.flags }}' -o build/${{ env.BINARY_NAME }}-darwin-arm64 ./cmd/sdwan-triage
          tar -czf build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz -C build ${{ env.BINARY_NAME }}-darwin-arm64

      - name: Build Windows amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags '${{ steps.ldflags.outputs.flags }}' -o build/${{ env.BINARY_NAME }}-windows-amd64.exe ./cmd/sdwan-triage
          cd build && zip ${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-windows-amd64.zip ${{ env.BINARY_NAME }}-windows-amd64.exe

      # ─── CHECKSUMS ────────────────────────────────────────
      - name: Generate checksums
        working-directory: build
        run: |
          sha256sum *.tar.gz *.zip > checksums-${{ steps.version.outputs.tag }}.txt
          cat checksums-${{ steps.version.outputs.tag }}.txt

      # ─── GITHUB RELEASE ───────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SD-WAN Triage ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-darwin-amd64.tar.gz
            build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            build/${{ env.BINARY_NAME }}-${{ steps.version.outputs.tag }}-windows-amd64.zip
            build/checksums-${{ steps.version.outputs.tag }}.txt
